name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Datos OSM (integridad y coordenadas)
        run: python pruebas/test_datos.py
      - name: Asociación espacial paradas-recorridos
        run: python pruebas/test_asociacion.py
      - name: Reportes (validaciones, rate-limit, frecuencia, privacidad)
        run: python pruebas/test_reportes.py
